name: Release firmware

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TEMPLATE: zehnder-comfoair-rf.yaml
  DEVICE: zehnder-comfoair

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Guard, template must be secret-free and version-consistent
        run: |
          set -e
          ! grep -nE '!secret|manual_ip|static_ip|timezone:|key:|password:' "$TEMPLATE" \
            || { echo "::error::house-specific value in release template"; exit 1; }
          ver=$(grep -E '^\s*project_version:' "$TEMPLATE" | sed -E 's/.*"([^"]+)".*/\1/')
          echo "project_version=$ver" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$ver" ]] \
              || { echo "::error::tag $GITHUB_REF_NAME != v$ver"; exit 1; }
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome==2026.8.2

      - name: Build
        run: esphome compile "$TEMPLATE"

      - name: Collect firmware
        run: |
          set -e
          mkdir -p dist
          bin=$(find .esphome/build -name firmware.factory.bin | head -n1)
          [[ -n "$bin" ]] || { echo "::error::factory bin not found"; exit 1; }
          cp "$bin" "dist/${DEVICE}-${project_version}.factory.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/*.bin

      # Builds both channels: this tag's fresh bin plus the other channel's bin
      # from its GitHub Release. Same script as pages.yml.
      - name: Assemble site
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOCAL_TAG: ${{ github.ref_name }}
        run: LOCAL_BIN="dist/${DEVICE}-${project_version}.factory.bin" .github/scripts/assemble-site.sh

      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.bin
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  deploy-pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
