name: Deploy pages

# Docs-only deploy: rebuilds the Pages site with the firmware from the existing
# GitHub Releases, no ESPHome compile. Firmware itself only changes via release.yml.
# The root manifest always comes from the newest stable release, so a pre-release
# project_version on main never reaches the regular flash page.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', '.github/scripts/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  DEVICE: zehnder-comfoair

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site with released firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/assemble-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
